name: Build & auto-refresh site

on:
  push:
    branches: [main]
    paths: ["build/**", "assets/**", ".github/workflows/refresh.yml"]
  schedule:
    - cron: "17 5 * * 1"   # every Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pages, limits data and sitemap
        run: python3 build/build.py

      - name: Sanity checks
        run: python3 build/check.py

      - name: Commit refreshed output (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-refresh build ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Request a fresh GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped (Pages may use a different source)."
